name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ── 1. Security guards ────────────────────────────────────────────────────────
  security-guards:
    name: Security guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew securityGuards

  # ── 2. Tests ──────────────────────────────────────────────────────────────────
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: core-math tests (golden, false-positive, property, fuzz, stress, performance, locale)
        run: ./gradlew :core-math:test

      - name: feature-glue tests
        run: ./gradlew :feature-glue:test

      - name: app & ime unit tests
        run: ./gradlew :app:test :ime:test :design-system:test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: |
            core-math/build/reports/tests/
            app/build/reports/tests/
            ime/build/reports/tests/
            design-system/build/reports/tests/

  # ── 3. Reproducibility (build twice, diff) ────────────────────────────────────
  reproducibility:
    name: Reproducibility
    runs-on: ubuntu-latest
    needs: [security-guards, tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: First build
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/build1.apk

      - name: Clean
        run: ./gradlew clean

      - name: Second build
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/build2.apk

      - name: Diff builds
        run: |
          if cmp -s /tmp/build1.apk /tmp/build2.apk; then
            echo "Reproducibility check PASSED."
          else
            echo "Reproducibility check FAILED: builds differ."
            python3 - <<'EOF'
          import zipfile, hashlib
          def hashes(path):
              with zipfile.ZipFile(path) as z:
                  return {n: hashlib.sha256(z.read(n)).hexdigest() for n in z.namelist()}
          a, b = hashes("/tmp/build1.apk"), hashes("/tmp/build2.apk")
          for k in sorted(set(a) | set(b)):
              if a.get(k) != b.get(k):
                  print(f"  DIFFERS: {k}")
          EOF
            exit 1
          fi

  # ── 4. Signed release build + SBOM + checksums ───────────────────────────────
  release-build:
    name: Signed release build
    runs-on: ubuntu-latest
    needs: [security-guards, tests]
    env:
      TALLY_KEYSTORE_PATH: /tmp/tally-release.jks
      TALLY_KEYSTORE_PASS: ${{ secrets.TALLY_KEYSTORE_PASS }}
      TALLY_KEY_ALIAS: ${{ secrets.TALLY_KEY_ALIAS }}
      TALLY_KEY_PASS: ${{ secrets.TALLY_KEY_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Write keystore from secret
        run: echo "${{ secrets.TALLY_KEYSTORE_B64 }}" | base64 -d > /tmp/tally-release.jks

      - name: Assemble signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Bundle signed release AAB (for Play)
        run: ./gradlew :app:bundleRelease

      - name: Generate SBOM
        run: ./gradlew :app:cyclonedxBom

      - name: Compute SHA-256 checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256 2>/dev/null || \
            sha256sum app-release-unsigned.apk > app-release-unsigned.apk.sha256
          cd ../../../../..
          cd app/build/outputs/bundle/release
          sha256sum app-release.aab > app-release.aab.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/release/app-release*.apk
            app/build/outputs/apk/release/*.sha256

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/*.sha256

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: app/build/reports/bom.json

  # ── 5. GitHub Release ─────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [reproducibility, release-build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist/apk

      - name: Download AAB artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: dist/aab

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: dist/sbom

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk "/^## \[$VERSION\]/{found=1; next} found && /^## /{exit} found{print}" \
            CHANGELOG.md > /tmp/release-notes.md
          echo "notes_file=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Tally ${{ github.ref_name }}"
          body_path: ${{ steps.changelog.outputs.notes_file }}
          files: |
            dist/apk/*
            dist/aab/*
            dist/sbom/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
