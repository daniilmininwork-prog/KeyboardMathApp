org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Reproducible builds: strip build-machine timestamps and paths from archive metadata
# so the same source + toolchain always produces a bit-for-bit identical artifact.
kotlin.build.report.output=file

# Dependency verification: strict mode — checksums in gradle/verification-metadata.xml
# must match every resolved artifact. Re-seed after any dependency change with:
#   ./gradlew --write-verification-metadata sha256 help
org.gradle.dependency.verification=strict
